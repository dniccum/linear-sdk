name: run-tests

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - '**.blade.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  # The core must work in an application that has no Laravel framework at all
  # (Symfony, Slim, plain PHP): install without dev dependencies, so only the
  # standalone Illuminate packages come along, and run a smoke test.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]
        stability: [prefer-lowest, prefer-stable]

    name: Core without Laravel - P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install the package into an empty project
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '{"minimum-stability": "dev", "prefer-stable": true}' > composer.json
          composer config repositories.sdk "{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE\", \"options\": {\"symlink\": false}}"
          composer require "dniccum/linear-sdk:*@dev" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Make sure the Laravel framework is not installed
        working-directory: ${{ runner.temp }}/consumer
        run: |
          composer show
          if composer show | grep -E '^laravel/framework '; then
            echo "::error::laravel/framework must not be installed for the core to be tested"
            exit 1
          fi

      - name: Run the smoke test
        working-directory: ${{ runner.temp }}/consumer
        run: php -d zend.assertions=1 -d assert.exception=1 "$GITHUB_WORKSPACE/tests/Standalone/smoke.php"
        env:
          LINEAR_AUTOLOAD: ${{ runner.temp }}/consumer/vendor/autoload.php

  coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  # The core must work in an application that has no Laravel framework at all
  # (Symfony, Slim, plain PHP): install without dev dependencies, so only the
  # standalone Illuminate packages come along, and run a smoke test.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]
        stability: [prefer-lowest, prefer-stable]

    name: Core without Laravel - P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install the package without dev dependencies
        run: |
          composer update --no-dev --no-scripts --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Make sure the Laravel framework is not installed
        run: |
          if composer show | grep -E '^laravel/framework '; then
            echo "::error::laravel/framework must not be installed for the core to be tested"
            exit 1
          fi

      - name: Run the smoke test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/Standalone/smoke.php

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Coverage (100%)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Execute tests with coverage
        run: vendor/bin/pest --ci --coverage --min=100 --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
