name: frontend

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'public/build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Ensure committed assets are up to date
        run: git diff --exit-code -- public/build
