<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Linear SDK for Laravel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#5E6AD2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c78e6"/>
      <stop offset="1" stop-color="#4a55bd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Linear mark, scaled from its 24x24 grid -->
  <g transform="translate(880 170)">
    <rect x="-30" y="-30" width="380" height="380" rx="90" fill="#5E6AD2" fill-opacity="0.12"/>
    <rect width="320" height="320" rx="72" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="317" height="317" rx="70.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    <g transform="translate(64 64) scale(8.6667)" fill="#ffffff">
      <path d="M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z"/>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="96" y="262" font-size="104" font-weight="700" fill="#ffffff" letter-spacing="-3">Linear SDK</text>
    <text x="96" y="336" font-size="52" font-weight="400" fill="#b4b9d6">for Laravel</text>
    <text x="96" y="404" font-size="28" fill="#8b90ad">Create Linear issues from your Eloquent models.</text>

    <g transform="translate(96 448)" font-size="20" font-weight="600">
      <rect width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="98" y="27" text-anchor="middle" fill="#d6d9ee">Laravel 12 &amp; 13</text>
      <rect x="212" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="286" y="27" text-anchor="middle" fill="#d6d9ee">PHP 8.3+</text>
      <rect x="376" width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="494" y="27" text-anchor="middle" fill="#d6d9ee">OAuth &amp; API key</text>
    </g>
  </g>
</svg>
